
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore ideas, stories and knowledge shared by people on READ-X.">

    <title>Read | READ-X</title>

    <link rel="stylesheet" href="./read.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Background Effects -->
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <!-- Header -->
    <header class="page-header">

        <a href="./home.html" class="logo">
            READ<span>-X</span>
        </a>

        <p class="header-caption">
            A place for ideas and stories.
        </p>

    </header>


    <!-- Main Content -->
    <main class="main-container">

        <!-- Introduction -->
        <section class="page-intro" id="pageIntro">

            <span class="eyebrow">EXPLORE IDEAS</span>

            <h1>
                Discover something <span>new.</span>
            </h1>

            <p>
                Read thoughts, stories and knowledge shared by people.
            </p>

        </section>


        <!-- Search -->
        <section class="search-section" id="searchSection">

            <div class="search-box">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m16 16 4 4"></path>
                </svg>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search publications..."
                    autocomplete="off"
                    aria-label="Search publications"
                >

            </div>

        </section>


        <!-- Publications -->
        <section class="publications-section" id="publicationsSection">

            <div class="section-heading">

                <h2>Latest publications</h2>

                <span id="publicationCount">
                    Loading...
                </span>

            </div>

            <div
                class="publication-list"
                id="publicationList"
                aria-live="polite"
            ></div>


            <!-- Empty State -->
            <div class="empty-state" id="emptyState" hidden>

                <div class="empty-icon">⌕</div>

                <h3>No publications found</h3>

                <p>
                    Try searching with another word.
                </p>

            </div>

        </section>


        <!-- FULL ARTICLE READING AREA -->
        <section
            class="article-view"
            id="articleView"
            aria-live="polite"
            hidden
        >

            <button
                type="button"
                class="back-button"
                id="backToPublications"
            >
                 Back
            </button>

            <!-- JavaScript displays the complete article here -->
            <article
                class="article-content"
                id="articleContent"
            ></article>

        </section>

    </main>


    <!-- Footer -->
    <footer class="page-footer">

        <p>READ-X · Read. Think. Share.</p>

    </footer>


    <!-- Floating Navigation -->
    <nav class="floating-nav" id="floatingNav" aria-label="Main navigation">

        <a href="./home.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>

        <a
            href="./read.html"
            class="nav-item active"
            aria-current="page"
        >
            <span class="nav-icon">▤</span>
            <span>Read</span>
        </a>

        <a href="./share.html" class="nav-item">
            <span class="nav-icon">↗</span>
            <span>Share</span>
        </a>

    </nav>


    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Connection -->
    <script src="./supabase.js"></script>

    <!-- Read Page JavaScript -->
    <script src="./read.js"></script>

</body>
</html>
